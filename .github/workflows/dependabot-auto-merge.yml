name: Dependabot Auto-Merge

# `pull_request`, not `pull_request_target`: GitHub blocks `pull_request_target`
# by default in public repos from 2026-12-02. Dependabot-triggered runs only see
# Dependabot secrets, so PAT_TOKEN must also be stored as a Dependabot secret.
on: pull_request

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'joshuabaker/authkit-react-native'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Merged with a PAT (not GITHUB_TOKEN) so the merge triggers push workflows on main
      - name: Auto-merge minor and patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash
