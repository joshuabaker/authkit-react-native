name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Trusted publishing requires npm >= 11.5.1; Node 22's bundled npm is 10.x.
      - run: npm install -g npm@latest

      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          publish-script: pnpm changeset publish
          pr-title: "chore: version package"
          commit-message: "chore: version package"
          # npm auth is via OIDC trusted publishing. The PAT is only for Changesets'
          # pushes, PR and releases, so release-PR pushes trigger CI (GITHUB_TOKEN pushes don't).
          github-token: ${{ secrets.PAT_TOKEN }}
