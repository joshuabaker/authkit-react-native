name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Trusted publishing requires npm >= 11.5.1; Node 22's bundled npm is 10.x.
      # Pinned to npm 11 (not @latest): npm 12 changed `npm view --json` to output
      # an array, which breaks @changesets/cli's already-published check — it then
      # tries to republish existing versions and fails with EPUBLISHCONFLICT.
      # Unpin once changesets ships npm 12 support.
      - run: npm install -g npm@11

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          title: "chore: version package"
          commit: "chore: version package"
        env:
          # npm auth is via OIDC trusted publishing; GITHUB_TOKEN (PAT) is only for Changesets' git ops
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
